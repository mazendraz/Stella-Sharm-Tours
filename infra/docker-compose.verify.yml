# LOCAL QA ONLY. Never include this override in a VPS deployment.
name: stella-integration-verify
services:
  postgres:
    ports: ['127.0.0.1:4991:5432']
    networks: [internal, edge]
  api:
    image: stella-local/stella-api:integration
    ports: ['127.0.0.1:4984:4000']
  worker:
    image: stella-local/stella-api:integration
    environment:
      NODE_ENV: test
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      SMTP_SECURE: 'false'
      TRANSLATE_PROVIDER: fake
    depends_on:
      mailpit: { condition: service_started }
  migrate:
    image: stella-local/stella-api:integration
  web:
    image: stella-local/stella-web:integration
    ports: ['127.0.0.1:4985:3000']
  admin:
    image: stella-local/stella-admin:integration
    ports: ['127.0.0.1:4986:3001']
  caddy:
    ports: !override ['127.0.0.1:4983:8080']
    volumes:
      - ./Caddyfile.verify:/etc/caddy/Caddyfile:ro
    networks: !override
      edge: { ipv4_address: '${CADDY_IP}' }
  mailpit:
    image: axllent/mailpit:v1.33.1
    networks: [edge]
    ports: ['127.0.0.1:4987:8025']
networks:
  gateway:
    external: false
    name: stella-integration-verify-unused
