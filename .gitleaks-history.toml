title = "Stella full-history scanning"
[extend]
useDefault = true
[allowlist]
description = "Known public schema identifier, not a credential"
regexTarget = "secret"
regexes = ['''^i18n_glossary$''']
# Unlike the source scan, committed .local/.env/tool files are NOT exempt.

# Extend the default generic-api-key rule only.
[[rules]]
id = "generic-api-key"
[[rules.allowlists]]
description = "Video slugs (lowercase-hyphenated ids) in the film-review manifests, not credentials"
condition = "AND"
regexTarget = "secret"
regexes = ['''^[a-z0-9]+(?:-[a-z0-9]+)+$''']
paths = ['''(^|/)(Stella-Videos|reports/stella-film-review)/(manifest\.json|index\.html)$''']
