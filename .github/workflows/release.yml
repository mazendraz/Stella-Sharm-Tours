name: Release images and deploy
on:
  push:
    branches: [develop]
    tags: ['v*.*.*']
  workflow_dispatch:
permissions: { contents: read }
concurrency:
  group: deploy-${{ startsWith(github.ref, 'refs/tags/') && 'production' || 'staging' }}
  cancel-in-progress: false
jobs:
  checks:
    uses: ./.github/workflows/ci.yml
  build:
    needs: checks
    # Manual runs may only release develop; staging holds scrubbed live data.
    if: startsWith(github.ref, 'refs/heads/') && (github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/develop')
    runs-on: ubuntu-24.04
    permissions: { contents: read, packages: write }
    strategy:
      matrix: { service: [web, admin, api] }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - id: image
        run: echo "prefix=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          {
            registry: ghcr.io,
            username: '${{ github.actor }}',
            password: '${{ secrets.GITHUB_TOKEN }}',
          }
      - name: Build immutable SHA images
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: infra/Dockerfile
          target: ${{ matrix.service }}
          push: true
          tags: ${{ steps.image.outputs.prefix }}/stella-${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
  deploy:
    needs: [checks, build]
    if: always() && needs.checks.result == 'success' && (needs.build.result == 'success' || startsWith(github.ref, 'refs/tags/'))
    runs-on: ubuntu-24.04
    environment: ${{ startsWith(github.ref, 'refs/tags/') && 'production' || 'staging' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { fetch-depth: 0 }
      - name: Select the exact tested commit
        id: release
        shell: bash
        run: |
          sha=$(git rev-parse HEAD)
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            git merge-base --is-ancestor "$sha" origin/main
            git merge-base --is-ancestor "$sha" origin/develop
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - name: Deploy via pinned SSH host
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
          TARGET_ENV: ${{ startsWith(github.ref, 'refs/tags/') && 'production' || 'staging' }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$DEPLOY_HOST" =~ ^[a-zA-Z0-9.-]+$ && "$DEPLOY_USER" =~ ^[a-z_][a-z0-9_-]*$ ]]
          [[ "$RELEASE_SHA" =~ ^[a-f0-9]{40}$ && "$TARGET_ENV" =~ ^(production|staging)$ ]]
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "$DEPLOY_USER@$DEPLOY_HOST" \
            "bash -s -- '$TARGET_ENV' '$RELEASE_SHA'" < infra/deploy-release.sh
