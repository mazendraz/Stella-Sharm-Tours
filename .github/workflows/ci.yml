name: Checks
on:
  workflow_call:
  pull_request:
  push:
    branches: [main, develop]
permissions: { contents: read }
concurrency:
  # Include the workflow name: release.yml calls this workflow for the same
  # ref, and a shared group let one run cancel the other (audit CI-01).
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      TURBO_TELEMETRY_DISABLED: '1'
      API_INTERNAL_URL: http://127.0.0.1:4100
      NEXT_PUBLIC_API_URL: http://127.0.0.1:4100
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      FFMPEG_PATH: ${{ github.workspace }}/infra/ci-ffmpeg.sh
      FFPROBE_PATH: ${{ github.workspace }}/infra/ci-ffprobe.sh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { fetch-depth: 0, persist-credentials: false }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: '22' }
      - run: corepack enable && corepack prepare pnpm@10.34.9 --activate
      - id: store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ steps.store.outputs.path }}
          key: ${{ runner.os }}-pnpm-node22-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-node22-
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm format:check
      - run: sudo apt-get update && sudo apt-get install -y shellcheck
      - run: docker build -f infra/Dockerfile --target api -t stella-ci-media . && chmod +x infra/ci-*.sh
      - run: pnpm test:prepare && pnpm security:setup
      - run: pnpm typecheck && pnpm lint && pnpm test
      - run: shellcheck scripts/check-schema-drift.sh && bash scripts/check-schema-drift.sh
      - run: pnpm test:integration
      - run: pnpm build
      - run: pnpm security:scan:source && pnpm security:scan:history
      - run: shellcheck infra/*.sh infra/backup/*.sh infra/monitoring/*.sh
      - run: bash infra/tests/operations.sh
      - run: >-
          docker run --rm --network none --entrypoint sh
          -v "$PWD/infra/tests/restic.sh:/verify.sh:ro"
          -v "$PWD/assets/images/stock/yacht.jpg:/fixtures/poster.jpg:ro"
          -v "$PWD/assets/video-stock/hero6-private-h.mp4:/fixtures/clip.mp4:ro"
          restic/restic:0.19.1 /verify.sh
      - run: pnpm exec playwright install --with-deps chromium
      - name: Isolated frontend browser suite
        env:
          PLAYWRIGHT_CHANNEL: chromium
          MEDIA_PUBLIC_URL: http://127.0.0.1:4100
        run: |
          pnpm preview:fixture > "$RUNNER_TEMP/fixture.log" 2>&1 & fixture_pid=$!
          pnpm --filter @stella/web start > "$RUNNER_TEMP/web.log" 2>&1 & web_pid=$!
          trap 'kill "$fixture_pid" "$web_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:3000/healthz >/dev/null && curl -fsS http://127.0.0.1:4100/healthz >/dev/null; then break; fi
            if (( attempt == 45 )); then echo 'Fixture/web readiness failed'; exit 1; fi
            sleep 1
          done
          pnpm exec playwright test
      - name: Seeded website and admin browser checks
        env:
          PLAYWRIGHT_CHANNEL: chromium
          STELLA_INTEGRATION_VERIFY: '1'
        run: |
          set -euo pipefail
          pnpm infra:verify:setup
          base="$PWD/.local/integration-runtime/production"
          compose=(docker compose --env-file "$base/compose.env" -f infra/docker-compose.prod.yml -f infra/docker-compose.verify.yml)
          trap '"${compose[@]}" down --volumes' EXIT
          sudo chown 1000:1000 "$base/media" "$base/originals" "$base/caddy/data" "$base/caddy/config" "$base/setup"
          sudo chmod a+rx "$base/security"
          sudo chmod a+r "$base/security/common-passwords-100k.txt"
          docker tag stella-ci-media stella-local/stella-api:integration
          docker build -f infra/Dockerfile --target web -t stella-local/stella-web:integration .
          docker build -f infra/Dockerfile --target admin -t stella-local/stella-admin:integration .
          "${compose[@]}" up --detach --wait postgres mailpit
          "${compose[@]}" run --rm --no-deps migrate
          "${compose[@]}" run --rm --no-deps \
            --volume "$PWD/assets:/app/assets:ro" --volume "$base/setup:/private" \
            --env SEED_SETUP_FILE=/private/owner-setup.txt \
            migrate node --import tsx scripts/seed.ts
          "${compose[@]}" up --detach --wait api worker web admin caddy
          pnpm test:e2e:integration languages.spec.ts private-booking.spec.ts admin.spec.ts --project mobile
          pnpm test:e2e:admin dashboard.spec.ts --project mobile
          # Withdrawn content must stay withdrawn across a web restart (BUG-05).
          shellcheck infra/tests/withdrawn-content-restart.sh
          bash infra/tests/withdrawn-content-restart.sh
      - name: Production dependency audit
        if: ${{ !cancelled() }}
        run: pnpm audit --prod --audit-level moderate
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: test-failure
          path: test-results
          retention-days: 3
