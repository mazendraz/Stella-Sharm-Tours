name: Checks
on:
  workflow_call:
  pull_request:
  push:
    branches: [main, develop]
permissions: { contents: read }
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      TURBO_TELEMETRY_DISABLED: '1'
      API_INTERNAL_URL: http://127.0.0.1:4100
      NEXT_PUBLIC_API_URL: http://localhost:4100
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      FFMPEG_PATH: ${{ github.workspace }}/infra/ci-ffmpeg.sh
      FFPROBE_PATH: ${{ github.workspace }}/infra/ci-ffprobe.sh
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0, persist-credentials: false }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: corepack enable && corepack prepare pnpm@10.34.9 --activate
      - id: store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ${{ steps.store.outputs.path }}
          key: ${{ runner.os }}-pnpm-node22-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-node22-
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm format:check
      - run: sudo apt-get update && sudo apt-get install -y shellcheck
      - run: docker build -f infra/Dockerfile --target api -t stella-ci-media . && chmod +x infra/ci-*.sh
      - run: pnpm test:prepare && pnpm security:setup
      - run: pnpm typecheck && pnpm lint && pnpm test
      - run: pnpm test:integration
      - run: pnpm build
      - run: pnpm audit --prod --audit-level moderate
      - run: pnpm security:scan:source && pnpm security:scan:history
      - run: shellcheck infra/*.sh infra/backup/*.sh infra/monitoring/*.sh
      - run: bash infra/tests/operations.sh
      - run: docker run --rm --network none --entrypoint sh -v "$PWD/infra/tests/restic.sh:/verify.sh:ro" restic/restic:0.19.1 /verify.sh
      - run: pnpm exec playwright install --with-deps chromium
      - name: Isolated frontend browser suite
        env: { PLAYWRIGHT_CHANNEL: chromium }
        run: |
          pnpm preview:fixture > "$RUNNER_TEMP/fixture.log" 2>&1 & fixture_pid=$!
          pnpm --filter @stella/web start > "$RUNNER_TEMP/web.log" 2>&1 & web_pid=$!
          trap 'kill "$fixture_pid" "$web_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:3000/healthz >/dev/null && curl -fsS http://127.0.0.1:4100/healthz >/dev/null; then break; fi
            if (( attempt == 45 )); then echo 'Fixture/web readiness failed'; exit 1; fi
            sleep 1
          done
          pnpm exec playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-failure
          path: test-results
          retention-days: 3
