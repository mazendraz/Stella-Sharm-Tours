packages:
  - apps/*
  - packages/*

# Native install scripts are disabled until reviewed individually.
onlyBuiltDependencies: []

# Moved from package.json "pnpm" (newer pnpm versions ignore that field, which
# would silently drop the Next.js cache patch; audit QUAL-02).
overrides:
  'next-intl@4.15.0>@parcel/watcher': '-'
  'postcss': '8.5.32'
patchedDependencies:
  'next@15.5.29': patches/next@15.5.29.patch
