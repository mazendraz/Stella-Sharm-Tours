packages:
  - apps/*
  - packages/*

# Native install scripts are disabled until reviewed individually.
onlyBuiltDependencies: []

# Moved from package.json "pnpm" (newer pnpm versions ignore that field, which
# would silently drop the Next.js cache patch; audit QUAL-02).
overrides:
  'next-intl@4.15.0>@parcel/watcher': '-'
  'postcss': '8.5.32'
  # Dev-only advisories (Dependabot): GHSA-67mh-4wv8-2f99 via drizzle-kit and
  # GHSA-g3hv-75wg-m249 via typescript-eslint and testcontainers.
  'esbuild@<0.25.0': '0.25.12'
  'minimatch@>=7.0.0 <11.0.1': '11.0.8'
  # GHSA-3g3m-2fjr-6pw4 via testcontainers (dev-only test database).
  'glob@>=9.0.0 <14.0.2': '14.0.2'
patchedDependencies:
  'next@15.5.29': patches/next@15.5.29.patch
